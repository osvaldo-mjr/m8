<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Colours are literal rather than custom properties: this file is
       fetched as an image and renders outside the document, where a
       var() reference resolves to nothing. Values copied from
       packages/tokens/tokens.css, named here without their leading
       dashes because a pair of them is illegal inside an XML comment
       and makes the whole file unparseable. The first set of covers
       named the tokens in full and rendered as nothing at all, on both
       screens, while serving perfectly. -->

  <!-- Lid: m8-paper. A cover is paper, like every other piece on this
       table. The first set used m8-table for the lid, the colour of the
       surface a box is set down on. A box is an object on the wood. -->
  <rect width="200" height="200" fill="#fff6ec" />

  <!-- The grid runs off all four edges rather than sitting centred with a
       margin. Cropped, it fills the 64px thumbnail the phone lists with;
       centred, it would shrink to a smudge. -->
  <!-- Grid: m8-plank-seam -->
  <g stroke="#4a2e15" stroke-width="12" stroke-linecap="square">
    <line x1="70" y1="-10" x2="70" y2="210" />
    <line x1="130" y1="-10" x2="130" y2="210" />
    <line x1="-10" y1="70" x2="210" y2="70" />
    <line x1="-10" y1="130" x2="210" y2="130" />
  </g>

  <!-- The two marks wear the two seat colours this game seats, so a cover
       already carries the colours its players will. -->
  <!-- X: m8-person-1 -->
  <g stroke="#ff5b4a" stroke-width="14" stroke-linecap="round">
    <line x1="22" y1="22" x2="48" y2="48" />
    <line x1="48" y1="22" x2="22" y2="48" />
  </g>
  <!-- O: m8-person-8 -->
  <circle cx="100" cy="100" r="17" fill="none" stroke="#4c8dff" stroke-width="14" />
  <!-- X: m8-person-1 -->
  <g stroke="#ff5b4a" stroke-width="14" stroke-linecap="round">
    <line x1="152" y1="152" x2="178" y2="178" />
    <line x1="178" y1="152" x2="152" y2="178" />
  </g>
</svg>
