<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Colours are literal rather than custom properties: this file is
       fetched as an image and renders outside the document, where a
       var() reference resolves to nothing. Values copied from
       packages/tokens/tokens.css, named without their leading dashes
       because a pair of them is illegal inside an XML comment. -->

  <!-- Lid: m8-paper -->
  <rect width="200" height="200" fill="#fff6ec" />

  <!-- Chess and draughts share a board, so the board cannot be what tells
       them apart. This one is the black-and-white field; draughts gets a
       wooden one. The piece does the rest: a pawn here, a stacked king
       there — one silhouette that is never the other. -->
  <!-- Dark squares: m8-plank-seam -->
  <g fill="#4a2e15">
    <rect x="0" y="0" width="50" height="50" />
    <rect x="100" y="0" width="50" height="50" />
    <rect x="50" y="50" width="50" height="50" />
    <rect x="150" y="50" width="50" height="50" />
    <rect x="0" y="100" width="50" height="50" />
    <rect x="100" y="100" width="50" height="50" />
    <rect x="50" y="150" width="50" height="50" />
    <rect x="150" y="150" width="50" height="50" />
  </g>

  <!-- One pawn, oversized and running off the bottom edge, so it reads at
       a thumbnail's size. Paper filled with an ink outline, so it holds
       its shape across both colours of square. -->
  <g fill="#fff6ec" stroke="#4a2e15" stroke-width="9" stroke-linejoin="round">
    <path d="M 74 200 L 82 128 L 118 128 L 126 200 Z" />
    <rect x="74" y="112" width="52" height="18" rx="6" />
    <circle cx="100" cy="82" r="26" />
  </g>
</svg>
