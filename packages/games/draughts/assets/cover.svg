<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Colours are literal rather than custom properties: this file is
       fetched as an image and renders outside the document, where a
       var() reference resolves to nothing. Values copied from
       packages/tokens/tokens.css, named without their leading dashes
       because a pair of them is illegal inside an XML comment. -->

  <!-- Lid: m8-paper -->
  <rect width="200" height="200" fill="#fff6ec" />

  <!-- A wooden board, where chess gets the black-and-white one. -->
  <!-- Dark squares: m8-table -->
  <g fill="#945f35">
    <rect x="0" y="0" width="50" height="50" />
    <rect x="100" y="0" width="50" height="50" />
    <rect x="50" y="50" width="50" height="50" />
    <rect x="150" y="50" width="50" height="50" />
    <rect x="0" y="100" width="50" height="50" />
    <rect x="100" y="100" width="50" height="50" />
    <rect x="50" y="150" width="50" height="50" />
    <rect x="150" y="150" width="50" height="50" />
  </g>

  <!-- A crowned king: two discs stacked, which is the one shape chess
       never makes. Stacking is what winning looks like in this game, so
       the cover shows the end of a game rather than its setup. -->
  <!-- Discs: m8-person-1, rimmed in m8-paper -->
  <g fill="#ff5b4a" stroke="#fff6ec" stroke-width="8">
    <ellipse cx="100" cy="140" rx="52" ry="30" />
    <ellipse cx="100" cy="106" rx="52" ry="30" />
  </g>
</svg>
