<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Colours are literal rather than custom properties: this file is
       fetched as an image and renders outside the document, where a
       var() reference resolves to nothing. Values copied from
       packages/tokens/tokens.css, named without their leading dashes
       because a pair of them is illegal inside an XML comment. -->

  <!-- Lid: m8-paper -->
  <rect width="200" height="200" fill="#fff6ec" />

  <!-- One tile, tilted and running off both ends, at the angle a tile
       lands at when somebody puts it down without looking. The other
       three covers are square to the frame; this one is the reason the
       shelf does not read as a set of icons. -->
  <g transform="rotate(-14 100 100)">
    <!-- Tile: m8-ground -->
    <rect x="34" y="-16" width="132" height="232" rx="16" fill="#1c1614" />
    <!-- Bar and pips: m8-paper -->
    <rect x="34" y="94" width="132" height="12" fill="#fff6ec" />
    <g fill="#fff6ec">
      <circle cx="68" cy="26" r="14" />
      <circle cx="132" cy="26" r="14" />
      <circle cx="68" cy="64" r="14" />
      <circle cx="132" cy="64" r="14" />
      <circle cx="100" cy="150" r="14" />
    </g>
  </g>
</svg>
